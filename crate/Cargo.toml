[package]
name = "fastm"
version = "0.0.0"
edition = "2021"
publish = false
description = "Stata plugin for Structural Topic Models, backed by topica-core (Rust)."

[lib]
name = "fastm"
# staticlib: build/build.sh links this .a together with the StataCorp shim
# (shim.c + vendor/stplugin.c) into the final `fastm.plugin` shared object.
crate-type = ["staticlib"]

# NB: keep the default panic = "unwind". fastm_entry wraps its body in
# catch_unwind and converts a panic into a Stata return code, so panics never
# cross the extern "C" boundary into Stata. panic = "abort" would make
# catch_unwind useless (and take Stata down with it).

[dependencies]
# The engine. Git dependency so clean clones and CI build without needing the
# topica repo as a sibling. For local engine development, crate/.cargo/config.toml
# (gitignored) overrides this with the local path. Pin to a tag/rev for releases.
# default-features = false keeps serde out (vendorable).
# Pinned to v0.50.0, which carries the engine fixes that reach fastm's existing
# surface (batch fit_ctm + SAGE content + effects): topica #442 (per-doc ν recompute
# for content models), #432 (empty-doc θ from the prior mode), #445 (non-PD Σ
# inverse/log-det consistency), and #542 (spectral projection threshold default 10000
# = R stm parity). None of the new content_time/l1 knobs are exposed: fit_ctm is called
# with content_time_rw=None, content_prior_var=1.0, content_l1=0.0 -> the v0.32.0
# content solve, bit-exact, and spectral_proj_threshold = DEFAULT_PROJ_THRESHOLD.
topica-core = { git = "https://github.com/nealcaren/topica", tag = "v0.50.0", default-features = false }
rand = "0.8"
rand_chacha = "0.3"   # ChaCha8Rng, same stream as topica-core
